name : Communicating with Cliq

on:
  workflow_run:
    workflows: ["Deploy to Firebase Functions", "Deploy to Firebase Hosting", "Deploy WireGuard Server", "Destroy WireGuard Server"]
    types:
      - completed
      - requested

jobs:
  connecting_cliq:
    environment: 'Production'
    runs-on: ubuntu-latest
    steps:
      - name: Get workflow run information
        id: workflow_info
        run: |
          echo "conclusion=${{ github.event.workflow_run.conclusion }}" >> $GITHUB_OUTPUT
          echo "workflow_name=${{ github.event.workflow_run.workflow.name }}" >> $GITHUB_OUTPUT
          echo "run_number=${{ github.event.workflow_run.run_number }}" >> $GITHUB_OUTPUT
          echo "html_url=${{ github.event.workflow_run.html_url }}" >> $GITHUB_OUTPUT

      - uses: Integrations-dev/GitHub-Informer@v1
        with:
          channel-endpoint: ${{ secrets.GITHUBOT_CLIQ }}
          default-message : |
            Workflow "${{ steps.workflow_info.outputs.workflow_name }}" run #${{ steps.workflow_info.outputs.run_number }} is ${{ steps.workflow_info.outputs.conclusion }}.
            Details: ${{ steps.workflow_info.outputs.html_url }} # Include the URL
          set-message-if-none: false # Don't set a default message if the custom message is provided
