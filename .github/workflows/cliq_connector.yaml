name : Communicating with Cliq

on:
  workflow_run:
    workflows: ["Deploy to Firebase Functions", "Deploy to Firebase Hosting", "Deploy WireGuard Server", "Destroy WireGuard Server"]
    types:
      - completed
      - requested

jobs:
  connecting_cliq:
    environment: 'Production'
    runs-on: ubuntu-latest
    steps:
      - name: Send to Cliq
        env:
          GITHUBOT_CLIQ: ${{ secrets.GITHUBOT_CLIQ }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{"text": "Workflow ${{ github.event.workflow_run.display_title }} run #${{ github.event.workflow_run.run_number }} is ${{ github.event.workflow_run.status }}. Details: ${{ github.event.workflow_run.html_url }}"}' "$GITHUBOT_CLIQ"
