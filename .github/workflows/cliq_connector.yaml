name : Communicating with Cliq

on:
  check_run:
  deployment_status:
  workflow_dispatch:

jobs:
  connecting_cliq:
    environment: 'production'
    runs-on: ubuntu-latest
    steps:
      - uses: Integrations-dev/GitHub-Informer@v1
        with:
          channel-endpoint: ${{ secrets.GITHUBOT_CLIQ }}
