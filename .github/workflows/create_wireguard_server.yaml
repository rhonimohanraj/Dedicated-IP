name: Create WireGuard Server
run-name: Create WireGuard Server - ${{ inputs.server_name }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: "Development"
        type: choice
        options:
          - Development
          - Production
      server_name:
        description: "Server Name"
        required: true
        type: string
      domain_prefix:
        description: "Domain Prefix"
        required: true
        type: string
      admin_panel_username:
        description: "Admin Panel Username"
        required: true
        type: string
        default: "admin"
      admin_panel_password:
        description: "Admin Panel Password"
        required: true
        type: string
      server_type:
        description: "Server Type"
        required: true
        type: choice
        options:
          - cx22
          - cx32
          - cx42
          - cx52
      server_location:
        description: "Server Location"
        required: true
        type: choice
        options:
          - fsn1
          - nbg1
          - hel1
          - ash
          - hil
          - sin


jobs:
  create_server:
    name: Create WireGuard Server - ${{ inputs.server_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
      TF_VAR_server_name: ${{ inputs.domain_prefix }}
      TF_VAR_domain_name: "${{ inputs.domain_prefix }}.${{ secrets.DOMAIN }}"
      TF_VAR_ssl_email: "info@${{ secrets.DOMAIN }}"
      TF_VAR_ssh_key_name: ${{inputs.environment}}
      TF_VAR_admin_panel_username: ${{ inputs.admin_panel_username }}
      TF_VAR_admin_panel_password: ${{ inputs.admin_panel_password }}
      TF_VAR_server_type: ${{ inputs.server_type }}
      TF_VAR_server_location: ${{ inputs.server_location }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/apps/wireguard

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: terraform/apps/wireguard

      - name: Save Terraform Outputs
        id: save_outputs
        run: |
          terraform output -json > output.json
        working-directory: terraform/apps/wireguard

      - name: Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-output
          path: terraform/apps/wireguard/output.json

  set_domain:
    name: Set Domain
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: create_server
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_TOKEN }}
      TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_record_name: ${{ inputs.domain_prefix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download Terraform Outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-output
          path: ./outputs

      - name: Extract Server IP
        id: extract_server_ip
        run: |
          server_ip=$(jq -r '.server_ip.value' ./outputs/output.json)
          echo "Extracted Server IP: $server_ip"
          echo "TF_VAR_record_value=$server_ip" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/cloudflare

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: terraform/cloudflare

  check_server:
    name: Check server up and running
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: set_domain
    steps:
      - name: Check Server Status
        id: check_status
        run: |
          domain_url="https://${{ inputs.domain_prefix }}.${{ secrets.DOMAIN }}/login"
          echo "Checking domain: $domain_url"
          max_attempts=20  # 5 minutes (20 attempts every 15 seconds)
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$domain_url")
            echo "Attempt $attempt: HTTP Status $status"
            if [ "$status" -eq 200 ]; then
              echo "Server returned HTTP 200!"
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 15
          done

          echo "ERROR: Server did not return HTTP 200 within 5 minutes"
          exit 1