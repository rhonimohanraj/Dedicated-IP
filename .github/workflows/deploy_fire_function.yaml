name: Deploy to Firebase Functions

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci --legacy-peer-deps
        working-directory: functions

      - name: 'Prepare Workspace'
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_DEDICATED_IP_PRODUCTION: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDICATED_IP_PRODUCTION }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_DEDICATED_IP_PRODUCTION" > ./gac.json

      - run: npx firebase-tools deploy
        env:
            GOOGLE_APPLICATION_CREDENTIALS: './gac.json'
        working-directory: functions