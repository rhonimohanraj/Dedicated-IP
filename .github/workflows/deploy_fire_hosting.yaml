name: Deploy to Firebase Hosting

on:
  workflow_dispatch:

jobs:
  publish:
    environment: Production
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: '${{ secrets.SENTRY_AUTH_TOKEN }}'
      SENTRY_ORG: '${{ secrets.SENTRY_ORG_ID }}'
      SENTRY_PROJECT: '${{ secrets.SENTRY_CLIENT_PROJECT_ID }}'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci --legacy-peer-deps
        working-directory: client

      - run: npx nx run-many --target build --parallel=3
        working-directory: client

      - name: Install Sentry
        run: curl -sL https://sentry.io/get-cli/ | sh
        working-directory: client

      - name: Upload Source Maps to Sentry
        run: sentry-cli releases files run-${{ github.run_number }} upload-sourcemaps dist --rewrite --url-prefix '~/dist'
        working-directory: client

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          entryPoint: client
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEDICATED_IP_PRODUCTION }}'
          channelId: live
          projectId: dedicated-ip-production
