name: deploy WireGuard Server
run-name: deploy WireGuard Server - ${{ inputs.domain_prefix }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: "Development"
        type: choice
        options:
          - Development
          - Production
      domain_prefix:
        description: "Domain Prefix"
        required: true
        type: string
      admin_panel_username:
        description: "Admin Panel Username"
        required: true
        type: string
        default: "admin"
      admin_panel_password:
        description: "Admin Panel Password"
        required: true
        type: string
      server_type:
        description: "Server Type"
        required: true
        type: choice
        options:
          - cpx11
          - cpx21
          - cx31
          - cx41
          - cx51
      server_location:
        description: "Server Location"
        required: true
        type: choice
        options:
          - fsn1
          - nbg1
          - hel1
          - ash
          - hil
          - sin

jobs:
  deploy_server:
    name: deploy WireGuard Server
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
      TF_VAR_server_name: ${{ inputs.domain_prefix }}
      TF_VAR_domain_name: "${{ inputs.domain_prefix }}.${{ vars.DOMAIN }}"
      TF_VAR_ssl_email: "info@${{ vars.DOMAIN }}"
      TF_VAR_ssh_key_name: ${{inputs.environment}}
      TF_VAR_admin_panel_username: ${{ inputs.admin_panel_username }}
      TF_VAR_admin_panel_password: ${{ inputs.admin_panel_password }}
      TF_VAR_server_type: ${{ inputs.server_type }}
      TF_VAR_server_location: ${{ inputs.server_location }}
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_telegram_token: ${{ secrets.TELEGRAM_TOKEN }}
      TF_VAR_telegram_allow_conf_request: ${{ vars.TELEGRAM_ALLOW_CONF_REQUEST }}
      TF_VAR_smtp_hostname: ${{ secrets.SMTP_HOSTNAME }}
      TF_VAR_smtp_port: ${{ secrets.SMTP_PORT }}
      TF_VAR_smtp_username: ${{ secrets.SMTP_USERNAME }}
      TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD }}
      TF_VAR_email_from_address: ${{ secrets.EMAIL_FROM_ADDRESS }}
      TF_VAR_email_from_name: ${{ secrets.EMAIL_FROM_NAME }}
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_BUCKET_STORAGE_CREDENTIALS }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 'Prepare Workspace'
        shell: bash
        env:
          gcp_bucket_storage_credentials: ${{ secrets.GCP_BUCKET_STORAGE_CREDENTIALS }}
        run: |
          echo "$gcp_application_credentials" > ./terraform/apps/wireguard/gcp_credentials.json

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{secrets.GCP_BUCKET_STORAGE_TERRAFORM_NAME}}" -backend-config="prefix=terraform/state/${{inputs.domain_prefix}}/server"
        working-directory: terraform/apps/wireguard

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: terraform/apps/wireguard

      - name: Save Terraform Outputs
        id: save_outputs
        run: |
          terraform output -json > output.json
        working-directory: terraform/apps/wireguard

      - name: Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-output
          path: terraform/apps/wireguard/output.json

  setup_domain:
    name: Set Domain
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: deploy_server
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_TOKEN }}
      TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_record_name: ${{ inputs.domain_prefix }}
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_BUCKET_STORAGE_CREDENTIALS }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 'Prepare Workspace'
        shell: bash
        env:
          gcp_bucket_storage_credentials: ${{ secrets.GCP_BUCKET_STORAGE_CREDENTIALS }}
        run: |
          echo "$gcp_application_credentials" > ./terraform/cloudflare/gcp_credentials.json

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download Terraform Outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-output
          path: ./outputs

      - name: Extract Server IP
        id: extract_server_ip
        run: |
          server_ip=$(jq -r '.server_ip.value' ./outputs/output.json)
          echo "Extracted Server IP: $server_ip"
          echo "TF_VAR_record_value=$server_ip" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{secrets.GCP_BUCKET_STORAGE_TERRAFORM_NAME}}" -backend-config="prefix=terraform/state/${{inputs.domain_prefix}}/domain"
        working-directory: terraform/cloudflare

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: terraform/cloudflare

  check_server:
    name: Check server up and running
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: setup_domain
    steps:
      - name: Check Server Status
        id: check_http_status
        run: |
          domain_url="https://${{ inputs.domain_prefix }}.${{ vars.DOMAIN }}/login"
          echo "Checking domain: $domain_url"
          max_attempts=40  # 10 minutes (40 attempts every 15 seconds)
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt: Checking domain status..."

            # Attempt to get the HTTP status code
            http_status=$(curl -s -o /dev/null -w "%{http_code}" "$domain_url" || echo "000")

            if [ "$http_status" -eq 200 ]; then
              echo "Domain is reachable with HTTP 200 status!"
              exit 0
            fi

            echo "HTTP status: $http_status (not 200). Retrying in 15 seconds..."
            attempt=$((attempt + 1))
            sleep 15
          done

          echo "ERROR: Domain did not return HTTP 200 within 10 minutes."
          exit 1