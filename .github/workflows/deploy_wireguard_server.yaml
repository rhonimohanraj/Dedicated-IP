name: Deploy WireGuard Server
run-name: Deploy WireGuard Server - ${{ inputs.domain_prefix }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: "Development"
        type: choice
        options:
          - Development
          - Production
      domain_prefix:
        description: "Domain Prefix"
        required: true
        type: string
      admin_panel_username:
        description: "Admin Panel Username"
        required: true
        type: string
        default: "admin"
      admin_panel_password:
        description: "Admin Panel Password"
        required: true
        type: string
      api_key:
        description: "API Key"
        required: true
        type: string
      datacenter_provider:
        description: "Datacenter Provider"
        required: true
        type: choice
        options:
          - hetzner
          - linode
          - arvan
      server_type:
        description: "Server Type"
        required: true
        type: choice
        options:
          - small
          - medium
          - big
      server_location:
        description: "Server Location"
        required: true
        type: choice
        options:
          - fsn1
          - nbg1
          - hel1
          - ash
          - hil
          - sin
          - ap-west
          - ca-central
          - ap-southeast
          - us-iad
          - us-ord
          - fr-par
          - us-sea
          - br-gru
          - nl-ams
          - se-sto
          - es-mad
          - in-maa
          - jp-osa
          - it-mil
          - us-mia
          - id-cgk
          - us-lax
          - gb-lon
          - au-mel
          - in-bom2
          - de-fra-2
          - sg-sin2
          - jp-tyo-3
          - us-central
          - us-west
          - us-southeast
          - us-east
          - eu-west
          - ap-south
          - eu-central
          - ap-northeast
          - ir-thr-ba1
          - ir-thr-fr1
          - ir-tbz-sh1
          - ir-thr-si1

  workflow_call:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: "Development"
        type: string
      domain_prefix:
        description: "Domain Prefix"
        required: true
        type: string
      admin_panel_username:
        description: "Admin Panel Username"
        required: true
        type: string
        default: "admin"
      admin_panel_password:
        description: "Admin Panel Password"
        required: true
        type: string
      api_key:
        description: "API Key"
        required: true
        type: string
      datacenter_provider:
        description: "Datacenter Provider"
        required: true
        default: "hetzner"
        type: string
      server_type:
        description: "Server Type"
        required: true
        type: string
        default: "small"
      server_location:
        description: "Server Location"
        required: true
        type: string
        default: "fsn1"

jobs:
  deploy_server:
    name: Deploy WireGuard Server
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
      TF_VAR_linode_token: ${{ secrets.LINODE_TOKEN }}
      TF_VAR_arvan_token: ${{ secrets.ARVAN_TOKEN }}
      TF_VAR_server_name: ${{ inputs.domain_prefix }}
      TF_VAR_domain_name: "${{ inputs.domain_prefix }}.${{ vars.DOMAIN }}"
      TF_VAR_ssl_email: "info@${{ vars.DOMAIN }}"
      TF_VAR_ssh_key_name: ${{inputs.environment}}
      TF_VAR_server_type: ${{ inputs.server_type }}
      TF_VAR_server_location: ${{ inputs.server_location }}
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_BUCKET_STORAGE_CREDENTIALS }}
    outputs:
      SERVER_IP: ${{ steps.extract_server_ip.outputs.server_ip }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: connect to proxy
        if: ${{ inputs.datacenter_provider == 'arvan' && vars.GH_PROXY_NETWORK == 'true' }}
        uses: ./.github/actions/connect_proxy
        with:
          WIREGUARD_CONFIG: ${{ secrets.GH_PROXY_NETWORK_CONFIG }}

      - name: 'Echo public IP'
        run: curl https://api.ipify.org

      - name: 'Prepare Workspace'
        shell: bash
        env:
          gcp_bucket_storage_credentials: ${{ secrets.GCP_BUCKET_STORAGE_CREDENTIALS }}
        run: |
          echo "$gcp_application_credentials" > ./terraform/${{inputs.datacenter_provider}}/gcp_credentials.json


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{secrets.GCP_BUCKET_STORAGE_TERRAFORM_NAME}}" -backend-config="prefix=terraform/state/${{inputs.domain_prefix}}/server"
        working-directory: terraform/${{inputs.datacenter_provider}}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: terraform/${{inputs.datacenter_provider}}

      - name: disconnect from proxy
        if: ${{ inputs.datacenter_provider == 'arvan' && vars.GH_PROXY_NETWORK == 'true' }}
        uses: ./.github/actions/disconnect_proxy

      - name: Save Terraform Outputs
        id: save_outputs
        run: |
          terraform output -json > output.json
        working-directory: terraform/${{inputs.datacenter_provider}}

      - name: Extract Server IP
        id: extract_server_ip
        run: |
          server_ip=$(jq -r '.server_ip.value' ./output.json)
          echo "Extracted Server IP: $server_ip"
          echo "SERVER_IP=$server_ip" >> $GITHUB_ENV
          echo "SERVER_IP=$server_ip" >> $GITHUB_OUTPUT
        working-directory: terraform/${{inputs.datacenter_provider}}

      - name: Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-output
          path: terraform/${{inputs.datacenter_provider}}/output.json

  setup_server:
    name: Setup server
    needs: deploy_server
    uses: ./.github/workflows/setup_wireguard_server.yaml
    with:
      server_ip: ${{ needs.deploy_server.outputs.SERVER_IP }}
      domain_prefix: ${{ inputs.domain_prefix }}
      admin_panel_username: ${{ inputs.admin_panel_username }}
      admin_panel_password: ${{ inputs.admin_panel_password }}
      api_key: ${{ inputs.api_key }}
      datacenter_provider: ${{ inputs.datacenter_provider }}
      server_type: ${{ inputs.server_type }}
      server_location: ${{ inputs.server_location }}
      environment: ${{ inputs.environment }}