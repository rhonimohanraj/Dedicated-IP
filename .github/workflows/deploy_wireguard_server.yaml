name: Deploy WireGuard Server
run-name: Deploy WireGuard Server - ${{ inputs.domain_prefix }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: "Development"
        type: choice
        options:
          - Development
          - Production
      domain_prefix:
        description: "Domain Prefix"
        required: true
        type: string
      admin_panel_username:
        description: "Admin Panel Username"
        required: true
        type: string
        default: "admin"
      admin_panel_password:
        description: "Admin Panel Password"
        required: true
        type: string
      datacenter_provider:
        description: "Datacenter Provider"
        required: true
        type: choice
        options:
          - hetzner
          - linode
          - arvan

      server_type:
        description: "Server Type"
        required: true
        type: choice
        options:
          - small
          - medium
          - big
      server_location:
        description: "Server Location"
        required: true
        type: choice
        options:
          - fsn1
          - nbg1
          - hel1
          - ash
          - hil
          - sin
          - ap-west
          - ca-central
          - ap-southeast
          - us-iad
          - us-ord
          - fr-par
          - us-sea
          - br-gru
          - nl-ams
          - se-sto
          - es-mad
          - in-maa
          - jp-osa
          - it-mil
          - us-mia
          - id-cgk
          - us-lax
          - gb-lon
          - au-mel
          - in-bom2
          - de-fra-2
          - sg-sin2
          - jp-tyo-3
          - us-central
          - us-west
          - us-southeast
          - us-east
          - eu-west
          - ap-south
          - eu-central
          - ap-northeast
          - ir-thr-ba1
          - ir-thr-fr1
          - ir-tbz-sh1
          - ir-thr-si1
jobs:
  deploy_server:
    name: Deploy WireGuard Server
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
      TF_VAR_linode_token: ${{ secrets.LINODE_TOKEN }}
      TF_VAR_arvan_token: ${{ secrets.ARVAN_TOKEN }}
      TF_VAR_server_name: ${{ inputs.domain_prefix }}
      TF_VAR_domain_name: "${{ inputs.domain_prefix }}.${{ vars.DOMAIN }}"
      TF_VAR_ssl_email: "info@${{ vars.DOMAIN }}"
      TF_VAR_ssh_key_name: ${{inputs.environment}}
      TF_VAR_server_type: ${{ inputs.server_type }}
      TF_VAR_server_location: ${{ inputs.server_location }}
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_BUCKET_STORAGE_CREDENTIALS }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 'Prepare Workspace'
        shell: bash
        env:
          gcp_bucket_storage_credentials: ${{ secrets.GCP_BUCKET_STORAGE_CREDENTIALS }}
        run: |
          echo "$gcp_application_credentials" > ./terraform/${{inputs.datacenter_provider}}/gcp_credentials.json

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{secrets.GCP_BUCKET_STORAGE_TERRAFORM_NAME}}" -backend-config="prefix=terraform/state/${{inputs.domain_prefix}}/server"
        working-directory: terraform/${{inputs.datacenter_provider}}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: terraform/${{inputs.datacenter_provider}}

      - name: Save Terraform Outputs
        id: save_outputs
        run: |
          terraform output -json > output.json
        working-directory: terraform/${{inputs.datacenter_provider}}

      - name: Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-output
          path: terraform/${{inputs.datacenter_provider}}/output.json

  setup_server:
    name: Setup server
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: deploy_server
    strategy:
      matrix:
        steps: [1]
    steps:
      - name: Download Terraform Outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-output
          path: ./outputs

      - name: Extract Server IP
        id: extract_server_ip
        run: |
          server_ip=$(jq -r '.server_ip.value' ./outputs/output.json)
          echo "Extracted Server IP: $server_ip"
          echo "SERVER_IP=$server_ip" >> $GITHUB_ENV

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          attempts=0
          max_attempts=12
          until ssh-keyscan ${{ env.SERVER_IP }} >> ~/.ssh/known_hosts || [[ $attempts -eq $max_attempts ]]
          do
            echo "Attempt $((attempts+1)) failed. Retrying..."
            sleep 10 # Wait before retrying
            attempts=$((attempts+1))
          done

          if [[ $attempts -eq $max_attempts ]]; then
            echo "Failed to connect after $max_attempts attempts."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Configure Ansible
        run: |
          cat << EOF > ~/.ansible.cfg
          [defaults]
          retries = 5

          [ssh_connection]
          ssh_args = -o ControlMaster=auto -o ControlPersist=1200
          pipelining = True
          EOF

      - name: Verify Ansible Configuration
        run: ansible-config view

      - name: Set username
        run: |
          if [[ "${{ inputs.datacenter_provider }}" == "arvan" ]]; then
            username="ubuntu"
          else
            username="root"
          fi
          echo "USERNAME=$username" >> $GITHUB_ENV

      - name: Create inventory file
        run: |
          cat /dev/null > inventory.ini
          echo "[wireguard_servers]" > inventory.ini
          echo "${{ env.SERVER_IP }} ansible_user=${{ env.USERNAME }}" >> inventory.ini
        working-directory: ansible/wireguard

      - name: Set environment variables for Ansible
        run: |
          cat /dev/null > vars/main.yml
          echo "domain_name: ${{ inputs.domain_prefix }}.${{ vars.DOMAIN }}" >> vars/main.yml
          echo "ssl_email: info@${{ vars.DOMAIN }}" >> vars/main.yml
          echo "admin_panel_username: ${{ inputs.admin_panel_username }}" >> vars/main.yml
          echo "admin_panel_password: ${{ inputs.admin_panel_password }}" >> vars/main.yml
          echo "wireguard_ui_version: ${{ vars.WIREGUARD_UI_VERSION }}" >> vars/main.yml
          echo "sendgrid_api: ${{ secrets.SENDGRID_API }}" >> vars/main.yml
          echo "email_from_address: ${{ secrets.EMAIL_FROM_ADDRESS }}" >> vars/main.yml
          echo "email_from_name: ${{ secrets.EMAIL_FROM_NAME }}" >> vars/main.yml
        working-directory: ansible/wireguard

      - name: Run Ansible playbook
        run: |
          attempts=0
          max_attempts=12
          until ansible-playbook -i inventory.ini playbook.yml || [[ $attempts -eq $max_attempts ]]
          do
          echo "Attempt $((attempts+1)) failed. Retrying..."
          sleep 10 # Wait before retrying
          attempts=$((attempts+1))
          done

          if [[ $attempts -eq $max_attempts ]]; then
          echo "Failed to complete run Ansible after $max_attempts attempts."
          exit 1
          fi
        working-directory: ansible/wireguard

  setup_domain:
    name: Set Domain
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: deploy_server
    strategy:
      matrix:
        steps: [1]
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_TOKEN }}
      TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_record_name: ${{ inputs.domain_prefix }}
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_BUCKET_STORAGE_CREDENTIALS }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 'Prepare Workspace'
        shell: bash
        env:
          gcp_bucket_storage_credentials: ${{ secrets.GCP_BUCKET_STORAGE_CREDENTIALS }}
        run: |
          echo "$gcp_application_credentials" > ./terraform/cloudflare/gcp_credentials.json

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download Terraform Outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-output
          path: ./outputs

      - name: Extract Server IP
        id: extract_server_ip
        run: |
          server_ip=$(jq -r '.server_ip.value' ./outputs/output.json)
          echo "Extracted Server IP: $server_ip"
          echo "TF_VAR_record_value=$server_ip" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{secrets.GCP_BUCKET_STORAGE_TERRAFORM_NAME}}" -backend-config="prefix=terraform/state/${{inputs.domain_prefix}}/domain"
        working-directory: terraform/cloudflare

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: terraform/cloudflare

  check_server:
    name: Check server up and running
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: [setup_domain, setup_server]
    steps:
      - name: Check Server Status
        id: check_http_status
        run: |
          domain_url="https://${{ inputs.domain_prefix }}.${{ vars.DOMAIN }}/login"
          echo "Checking domain: $domain_url"
          max_attempts=40  # 10 minutes (40 attempts every 15 seconds)
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt: Checking domain status..."

            # Attempt to get the HTTP status code
            http_status=$(curl -s -o /dev/null -w "%{http_code}" "$domain_url" || echo "000")

            if [ "$http_status" -eq 200 ]; then
              echo "Domain is reachable with HTTP 200 status!"
              exit 0
            fi

            echo "HTTP status: $http_status (not 200). Retrying in 15 seconds..."
            attempt=$((attempt + 1))
            sleep 15
          done

          echo "ERROR: Domain did not return HTTP 200 within 10 minutes."
          exit 1

  send_failed_signal:
    name: Send failed signal
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: check_server
    strategy:
      matrix:
        steps: [1]
    if: always() && failure()
    steps:
      - name: Send failed signal
        shell: bash
        run: |
            curl -X POST -H "Content-Type: application/json" -d '{"requestType":"finalize_action", "status": "failed", "name": "${{ inputs.domain_prefix }}", "secretKey": "${{secrets.GH_SECRET_KEY}}"}' "https://f.dedicated-ip.net/"

      - name: Alert in Cliq
        shell: bash
        env:
          GITHUBOT_CLIQ: ${{ secrets.GITHUBOT_CLIQ }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{"text": "🚨🚨🚨 Workflow ${{ steps.workflow_info.outputs.workflow_name }} run #${{ steps.workflow_info.outputs.run_number }} is Failed. Details: ${{ steps.workflow_info.outputs.html_url }} 🚨🚨🚨"}' "$GITHUBOT_CLIQ"

  send_success_signal:
    name: Send success signal
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: check_server
    strategy:
      matrix:
        steps: [1]
    if: always() && success()
    steps:
      - name: Send success signal
        shell: bash
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{"requestType":"finalize_action", "status": "active", "name": "${{ inputs.domain_prefix }}", "secretKey": "${{secrets.GH_SECRET_KEY}}"}' "https://f.dedicated-ip.net/"
