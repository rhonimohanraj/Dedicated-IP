name: Destroy WireGuard Server
run-name: Destroy WireGuard Server - ${{ inputs.domain_prefix }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: "Development"
        type: choice
        options:
          - Development
          - Production
      domain_prefix:
        description: "Domain Prefix"
        required: true
        type: string
      datacenter_provider:
        description: "Datacenter Provider"
        required: true
        type: choice
        options:
          - hetzner
          - linode
          - arvan


jobs:
  destroy_server:
    name: Destroy WireGuard Server
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
      TF_VAR_linode_token: ${{ secrets.LINODE_TOKEN }}
      TF_VAR_arvan_token: ${{ secrets.ARVAN_TOKEN }}
      TF_VAR_server_name: ${{ inputs.domain_prefix }}
      TF_VAR_domain_name: "${{ inputs.domain_prefix }}.${{ vars.DOMAIN }}"
      TF_VAR_ssl_email: "info@${{ vars.DOMAIN }}"
      TF_VAR_ssh_key_name: ${{inputs.environment}}
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_telegram_token: ${{ secrets.TELEGRAM_TOKEN }}
      TF_VAR_telegram_allow_conf_request: ${{ vars.TELEGRAM_ALLOW_CONF_REQUEST }}
      TF_VAR_sendgrid_api: ${{ secrets.SENDGRID_API }}
      TF_VAR_email_from_address: ${{ secrets.EMAIL_FROM_ADDRESS }}
      TF_VAR_email_from_name: ${{ secrets.EMAIL_FROM_NAME }}
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_BUCKET_STORAGE_CREDENTIALS }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 'Prepare Workspace'
        shell: bash
        env:
          gcp_bucket_storage_credentials: ${{ secrets.GCP_BUCKET_STORAGE_CREDENTIALS }}
        run: |
          echo "$gcp_application_credentials" > ./terraform/${{inputs.datacenter_provider}}/gcp_credentials.json

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{secrets.GCP_BUCKET_STORAGE_TERRAFORM_NAME}}" -backend-config="prefix=terraform/state/${{inputs.domain_prefix}}/server"
        working-directory: terraform/${{inputs.datacenter_provider}}

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
        working-directory: terraform/${{inputs.datacenter_provider}}

  destroy_domain:
    name: Destroy Domain
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: destroy_server
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_TOKEN }}
      TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_record_name: ${{ inputs.domain_prefix }}
      TF_VAR_record_value: '127.0.0.1'
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_BUCKET_STORAGE_CREDENTIALS }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 'Prepare Workspace'
        shell: bash
        env:
          gcp_bucket_storage_credentials: ${{ secrets.GCP_BUCKET_STORAGE_CREDENTIALS }}
        run: |
          echo "$gcp_application_credentials" > ./terraform/cloudflare/gcp_credentials.json

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{secrets.GCP_BUCKET_STORAGE_TERRAFORM_NAME}}" -backend-config="prefix=terraform/state/${{inputs.domain_prefix}}/domain"
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_BUCKET_STORAGE_CREDENTIALS }}
        working-directory: terraform/cloudflare

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_BUCKET_STORAGE_CREDENTIALS }}
        working-directory: terraform/cloudflare

  send_failed_signal:
    name: Send failed signal
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: destroy_domain
    if: always() && failure()
    steps:
      - name: Send failed signal
        shell: bash
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{"requestType":"finalize_action", "status": "failed-deleted", "name": "${{ inputs.domain_prefix }}", "secretKey": "${{secrets.GH_SECRET_KEY}}"}' "https://f.dedicated-ip.net/"

  send_success_signal:
    name: Send success signal
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: destroy_domain
    if: always() && success()
    steps:
      - name: Send success signal
        shell: bash
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{"requestType":"finalize_action", "status": "deleted", "name": "${{ inputs.domain_prefix }}", "secretKey": "${{secrets.GH_SECRET_KEY}}"}' "https://f.dedicated-ip.net/"
