name: "Dedicated-IP App build release"
run-name: "Dedicated-IP App ${{ inputs.tag }}"

on:
    workflow_call:
        inputs:
            tag:
                description: "Tag to release"
                required: true
                default: "v1.0.0"
                type: string
            asset_upload_url:
                description: "Upload URL for the release"
                required: true
                default: "https://uploads.github.com/repos/AshkanYarmoradi/releases/v1.0.0/assets{?name,label}"
                type: string

permissions:
    contents: write

jobs:
  build_linux:
    name: Build & Release on Linux
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        steps: [1]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Prepare workspace
        run: |
          file="./app/pubspec.yaml"
          old_string="1.0.0+1"
          new_string="${{ inputs.tag }}"
          escaped_new_string="${new_string/v/ }"
          sed -i 's/'"$old_string"'/'"$escaped_new_string"'/g' "$file"

      - name: Set Up Java
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get
        working-directory: app

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/android/app/keystore.keystore

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > app/android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> app/android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> app/android/key.properties
          echo "storeFile=keystore.keystore" >> app/android/key.properties

      - name: Build APK
        run: flutter build apk --release
        working-directory: app

      - name: Build appBundle
        run: flutter build appbundle --release
        working-directory: app

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Releases
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab

      - name: Upload Release Asset APK
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.asset_upload_url }}
          asset_path: ./app/build/app/outputs/flutter-apk/app-release.apk
          asset_name: app-release-${{ inputs.tag }}-${{ github.run_number }}.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload Release Asset AAB
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.asset_upload_url }}
          asset_path: ./app/build/app/outputs/bundle/release/app-release.aab
          asset_name: app-release-${{ inputs.tag }}-${{ github.run_number }}.aab
          asset_content_type: application/vnd.android.package-archive