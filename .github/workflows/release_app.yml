name: "Dedicated-IP App build release"

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.calculate_tag_name.outputs.tag }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Calculate Tag Name
        id: calculate_tag_name
        run: |
          echo "tag=$(git describe --tags --abbrev=0  | cut -d "-" -f 1)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.calculate_tag_name.outputs.tag }}-${{ github.run_number }}
          release_name: Release App ${{ steps.calculate_tag_name.outputs.tag }}-${{ github.run_number }}
          draft: false
          prerelease: false

  build_macos:
    name: Build & Release on MacOS
    needs: release
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Java
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get
        working-directory: app

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/android/app/keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > app/android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> app/android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> app/android/key.properties
          echo "storeFile=keystore.jks" >> app/android/key.properties

      - name: Build APK
        run: flutter build apk --release
        working-directory: app

      - name: Build appBundle
        run: flutter build appbundle
        working-directory: app

      - name: Build IPA
        run: flutter build ipa --no-codesign
        working-directory: app

      - name: Compress Archives and IPAs
        run: |
          cd app/build
          tar -czf ios_build.tar.gz ios

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Releases
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
            app/build/ios_build.tar.gz

      - name: Upload Release Asset APK
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: ./app/build/app/outputs/flutter-apk/app-release.apk
          asset_name: app-release-${{ needs.release.outputs.tag_name }}-${{ github.run_number }}.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload Release Asset AAB
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: ./app/build/app/outputs/bundle/release/app-release.aab
          asset_name: app-release-${{ needs.release.outputs.tag_name }}-${{ github.run_number }}.aab
          asset_content_type: application/vnd.android.package-archive

      - name: Upload Release Asset IPA
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: ./app/build/ios_build.tar.gz
          asset_name: app-release-${{ needs.release.outputs.tag_name }}-${{ github.run_number }}.tar.gz
          asset_content_type: application/gzip