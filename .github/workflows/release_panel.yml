name: Dedicated-IP Panel build release
run-name: Dedicated-IP Panel ${{ inputs.tag }}

on:
  workflow_call:
    inputs:
        tag:
            description: "Tag to release"
            required: true
            default: "v1.0.0"
            type: string
        asset_upload_url:
            description: "Upload URL for the release"
            required: true
            default: "https://uploads.github.com/repos/AshkanYarmoradi/releases/v1.0.0/assets{?name,label}"
            type: string

permissions:
  contents: write

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # build and publish in parallel: linux/386, linux/amd64, darwin/386, darwin/amd64
        goos: [linux, darwin]
        goarch: [386, amd64, arm, arm64]
        exclude:
          - goarch: 386
            goos: darwin
          - goarch: arm
            goos: darwin
          - goarch: arm64
            goos: darwin
        goarm:
          - 7
    steps:
    - uses: actions/checkout@v4

    - name: Set BUILD_TIME env
      run: echo "BUILD_TIME=$(date)" >> $GITHUB_ENV

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    - name: Prepare assets
      run: |
        cd ./panel
        chmod +x ./prepare_assets.sh
        ./prepare_assets.sh

    - name: Build and make the releases
      id: build
      uses: wangyoucao577/go-release-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        goos: ${{ matrix.goos }}
        goarch: ${{ matrix.goarch }}
        goversion: "https://dl.google.com/go/go1.21.5.linux-amd64.tar.gz"
        pre_command: export CGO_ENABLED=0
        binary_name: "wireguard-ui"
        build_flags: -v
        ldflags: -X "main.appVersion=${{ inputs.tag }}" -X "main.buildTime=${{ env.BUILD_TIME }}" -X main.gitCommit=${{ github.sha }} -X main.gitRef=${{ github.ref }}
        project_path: './panel'
        release_tag: ${{ inputs.tag }}
        upload: false

    - name: Print Folder Tree
      uses: jaywcjlove/github-action-folder-tree@main
      with:
        path: ./panel
        depth: 200

    - name: Upload Release Asset APK
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ inputs.asset_upload_url }}
        asset_path: ./panel/wireguard-ui-${{inputs.tag}}-${{matrix.goos}}-${{matrix.goarch}}.tar.gz
        asset_name: wireguard-ui-${{inputs.tag}}-${{matrix.goos}}-${{matrix.goarch}}.tar.gz
        asset_content_type: application/gzip

  upload-R2:
    name: Upload assets to R2
    runs-on: ubuntu-22.04
    needs: [releases-matrix]
    environment: 'Production'
    steps:
      - name: Download releases
        uses: robinraju/release-downloader@v1
        with:
          fileName: '*'
          tag: '${{ inputs.tag }}-${{ github.run_number }}'

      - name: Upload to R2
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: ./
          destination-dir: ./panel/${{ inputs.tag }}/
