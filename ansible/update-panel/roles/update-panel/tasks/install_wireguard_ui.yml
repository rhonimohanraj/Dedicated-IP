---
- name: Stop WireGuard UI service
  systemd:
    name: wireguard-ui
    state: stopped
    force: yes

- name: Download wireguard-ui
  get_url:
    url: "https://b.dedicated-ip.net/panel/V{{ wireguard_ui_version }}/wireguard-ui-V{{ wireguard_ui_version }}-linux-amd64.tar.gz"
    dest: "/tmp/wireguard-ui.tar.gz"
    mode: '0644'

- name: Unpack wireguard-ui
  unarchive:
    src: "/tmp/wireguard-ui.tar.gz"
    dest: "/usr/local/bin/wireguard-ui"
    remote_src: yes

- name: Enable and start WireGuard UI service
  systemd:
    name: wireguard-ui
    state: started
    enabled: yes
    daemon_reload: yes

- name: Wait for WireGuard UI to be up
  uri:
    url: http://localhost:5000/login
    method: GET
    status_code: 200
    retries: 10
    delay: 5
  register: result
  until: result.status == 200

- name: Print WireGuard UI status
  debug:
    msg: "WireGuard UI is up and running at http://localhost:5000"