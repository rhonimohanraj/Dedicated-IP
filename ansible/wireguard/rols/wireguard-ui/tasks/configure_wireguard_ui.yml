---
- name: Generate wireguard-ui session secret
  set_fact:
    session_secret: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"

- name: Hash admin password with bcrypt
  set_fact:
    hashed_password: "{{ admin_panel_password | password_hash('bcrypt') }}"

- name: Encode hashed password with base64
  set_fact:
    encoded_hashed_password: "{{ hashed_password | b64encode | regex_replace('/', '\\\\/') }}"

- name: Template wireguard-ui .env file
  template:
    src: .env.j2
    dest: /usr/local/bin/wireguard-ui/.env
    mode: '0644'

- name: Template postup.sh script
  template:
    src: postup.sh
    dest: /usr/local/bin/wireguard-ui/postup.sh
    mode: '0755'

- name: Template postdown.sh script
  template:
    src: postdown.sh
    dest: /usr/local/bin/wireguard-ui/postdown.sh
    mode: '0755'