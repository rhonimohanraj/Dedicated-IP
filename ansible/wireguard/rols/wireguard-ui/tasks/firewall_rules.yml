---
- name: Allow SSH through UFW
  ufw:
    rule: allow
    name: OpenSSH

- name: Allow HTTP and HTTPS through UFW
  ufw:
    rule: allow
    port: "{{ item }}"
    comment: "Allow {{ item }} for Caddy"
  with_items:
    - '80'
    - '443'

- name: Allow WireGuard through UFW
  ufw:
    rule: allow
    port: '51822'
    proto: udp
    comment: "Allow WireGuard"

- name: Enable UFW
  ufw:
    state: enabled

- name: Reload UFW
  ufw:
    state: reloaded