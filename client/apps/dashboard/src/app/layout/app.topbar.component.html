<p-toast/>
<div class="layout-topbar">
    <div class="topbar-start">
        <button #menubutton type="button" class="topbar-menubutton p-link p-trigger" (click)="onMenuButtonClick()">
            <i class="pi pi-bars"></i>
        </button>

        <app-breadcrumb class="topbar-breadcrumb"></app-breadcrumb>
    </div>
    <div class="layout-topbar-menu-section">
        <app-sidebar></app-sidebar>
    </div>
    <div class="topbar-end">
        <ul class="topbar-menu  ">

            <li  class="profile-item topbar-item " >
                <a pButton type="button" icon="pi pi-comment"  class="p-button-text p-button-secondary relative text-color-secondary p-button-rounded flex-shrink-0" pTooltip="Knowledge sharing / Submit a ticket" href="https://k.dedicated-ip.net/" target="_blank"></a>
            </li>

            <li #profile class="profile-item topbar-item " >
                <a pStyleClass="@next" enterFromClass="ng-hidden" enterActiveClass="px-scalein" leaveToClass="ng-hidden" leaveActiveClass="px-fadeout" [hideOnOutsideClick]="true" pRipple class="cursor-pointer">
                    @if(photoURL){
                      <img class="border-circle" src="{{photoURL}}">
                    } @else {
                      <i class="pi pi-user"></i>
                    }
                </a>

                <ul class="topbar-menu active-topbar-menu p-4 w-15rem z-5 ng-hidden border-round">
                    <li role="menuitem" class="m-0 mb-3">
                        <a (click)="onChangePassword()" class="flex align-items-center hover:text-primary-500 transition-duration-200 cursor-pointer" pStyleClass="@grandparent" enterFromClass="ng-hidden" enterActiveClass="px-scalein" leaveToClass="ng-hidden" leaveActiveClass="px-fadeout">
                            <i class="pi pi-fw pi-key mr-2"></i>
                            <span>Change Password</span>
                        </a>
                    </li>
                    <li role="menuitem" class="m-0">
                        <a (click)="onLogout()" class="flex align-items-center hover:text-primary-500 transition-duration-200 cursor-pointer" pStyleClass="@grandparent" enterFromClass="ng-hidden" enterActiveClass="px-scalein" leaveToClass="ng-hidden" leaveActiveClass="px-fadeout">
                            <i class="pi pi-fw pi-sign-out mr-2"></i>
                            <span>Logout</span>
                        </a>
                    </li>
                </ul>

            </li>
        </ul>
    </div>
</div>
