<p-toast />
<div class="surface-ground px-4 py-8 md:px-6 lg:px-8">
  <div class="text-900 font-bold text-6xl mb-4 text-center">Plans</div>
  <div class="grid">
    @for (product of products(); track $index){
      <div class="col-12 lg:col-4">
        <div class="p-3 h-full">
          <div class="shadow-2 p-3 h-full flex flex-column surface-card" style="border-radius: 6px">
            <div class="text-900 font-medium text-xl mb-2">
              <img
                src="http://purecatamphetamine.github.io/country-flag-icons/3x2/{{product.country_code | uppercase}}.svg"
                class="w-2 h-2 mr-2"
              />
              {{ product.title }}
            </div>
            <div class="text-600">{{ product.description }}</div>
            <hr class="my-3 mx-0 border-top-1 border-none surface-border" />
            <div class="flex align-items-center">
              <span class="font-bold text-2xl text-900">
                $
                @if (product.discount_price !== product.price){
                  <span class="text-500 line-through">{{product.price}}</span>
                }
                {{product.discount_price}} </span>
              <span class="ml-2 font-medium text-600">per month</span>
            </div>
            <hr class="my-3 mx-0 border-top-1 border-none surface-border" />
            <ul class="list-none p-0 m-0 flex-grow-1">
              @for (feature of product.features; track $index) {
                <li class="flex align-items-center mb-3">
                  <i class="pi pi-check-circle text-green-500 mr-2"></i>
                  <span class="text-900">{{feature}}</span>
                </li>
              }
            </ul>
            <hr class="mb-3 mx-0 border-top-1 border-none surface-border mt-auto" />
            <button pButton pRipple label="Buy Now" class="p-3 w-full mt-auto" (click)="createPaymentLink(product.stripe_price_id); button.disabled=true;" #button></button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
